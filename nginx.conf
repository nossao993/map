user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 🔒 Защита от "левых" доменов
    server {
        listen 80 default_server;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/letsencrypt/live/getgrade.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/getgrade.ru/privkey.pem;
        return 444;
    }

    # 🌐 Фронтенд APP: app.getgrade.ru
    server {
        listen 80;
        server_name app.getgrade.ru;

        root /var/www/safonovadverts;
        index index.html;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass https://172.18.0.3:1337/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/app.getgrade.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.getgrade.ru/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    }

    # 🌐 ЛЕНДИНГ: getgrade.ru и www.getgrade.ru
    server {
        listen 80;
        listen 443 ssl;
        server_name getgrade.ru www.getgrade.ru;

        ssl_certificate /etc/letsencrypt/live/getgrade.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/getgrade.ru/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 🗺️ Карта зарплат IT
        location /map {
            alias /var/www/map;
            index index.html;
            try_files $uri $uri/ /map/index.html;

            # Кеширование статики
            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Редирект остальных запросов на Framer
        location / {
            return 301 https://intellectual-mission-677356.framer.app$request_uri;
        }
    }

    # 🌐 API: api.getgrade.ru
    server {
        listen 80;
        server_name api.getgrade.ru;
        client_max_body_size 256M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://172.18.0.3:1337/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/getgrade.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/getgrade.ru/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    }
}

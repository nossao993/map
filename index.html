map = new mapboxgl.Map({
    container: 'map',
    style: mapStyle,
    center: [50, 50],
    zoom: 2.5
});

map.on('load', function() {
    // Делаем стандартные лейблы городов полупрозрачными (20%)
    var labelsToFade = [
        'settlement-subdivision-label',
        'settlement-minor-label', 
        'settlement-major-label',
        'state-label',
        'country-label'
    ];
    
    labelsToFade.forEach(function(label) {
        if (map.getLayer(label)) {
            map.setPaintProperty(label, 'text-opacity', 0.2);
        }
    });
    
    var topTwoCities = ['Москва', 'Санкт-Петербург'];
    var topFiveCities = ['Москва', 'Санкт-Петербург', 'Dubai', 'Tbilisi', 'Екатеринбург', 'Новосибирск', 'Казань'];
    
    var textColor = isDark ? '#FFFFFF' : '#0D0D0D';
    var subtextColor = isDark ? '#B0B0B0' : '#7f8c8d';
    var titleTextShadow = isDark ? 'none' : '-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 -1px 0 #fff, 0 1px 0 #fff, -1px 0 0 #fff, 1px 0 0 #fff';
    
    // Устанавливаем цвет для header
    var header = document.getElementById('pageHeader');
    if (header) {
        var headerTitle = header.querySelector('.header-title');
        var headerSubtitles = header.querySelectorAll('.header-subtitle');
        if (headerTitle) headerTitle.style.color = textColor;
        headerSubtitles.forEach(function(subtitle) {
            subtitle.style.color = textColor;
        });
    }
    
    cities.forEach(function(city) {
        var container = document.createElement('div');
        container.style.position = 'relative';
        container.style.width = '0px';
        container.style.height = '0px';
        
        var el = document.createElement('div');
        el.className = 'marker';
        var size = getSize(city.count);
        var color = getColor(city.salary);
        el.style.width = (size * 0.85) + 'px';
        el.style.height = (size * 0.85) + 'px';
        el.style.backgroundColor = color;
        el.style.position = 'absolute';
        el.style.left = '50%';
        el.style.top = '50%';
        el.style.transform = 'translate(-50%, -50%)';
        el.style.boxShadow = '0 0 ' + size + 'px ' + (size / 10) + 'px ' + color + ', 0 2px 8px rgba(0,0,0,0.3)';
        
        container.appendChild(el);
        
        var label = document.createElement('div');
        label.className = 'marker-label';
        label.style.left = (size / 2 + 10) + 'px';
        label.style.top = '50%';
        label.style.transform = 'translateY(-50%)';
        label.innerHTML = 
            '<div class="marker-label-city" style="color: ' + textColor + '; text-shadow: ' + titleTextShadow + ';">' + city.name + '</div>' +
            '<div class="marker-label-salary" style="color: ' + subtextColor + ';">' + city.count + ' зарплат' + '</div>';
        container.appendChild(label);
        
        var stacksHTML = city.stacks.map(function(stack) {
            return '<span class="popup-tag">' + stack + '</span>';
        }).join('');
        
        var companiesHTML = city.companies.map(function(company) {
            var logo = getCompanyLogo(company);
            var logoHTML;
            
            if (logo) {
                logoHTML = '<img src="' + logo + '" class="popup-company-logo" alt="' + company + '" ' +
                    'onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
                    '<div class="popup-company-logo-text" style="display:none;">' + getCompanyInitials(company) + '</div>';
            } else {
                logoHTML = '<div class="popup-company-logo-text">' + getCompanyInitials(company) + '</div>';
            }
            
            return '<div class="popup-company">' +
                logoHTML +
                '<div class="popup-company-name">' + company + '</div>' +
                '</div>';
        }).join('');
        
        var popup = new mapboxgl.Popup({ 
            offset: 25,
            closeButton: false,
            maxWidth: '320px'
        }).setHTML(
            '<div class="popup-header">' +
                '<div class="popup-city">' + city.name + '</div>' +
                '<div class="popup-salary">' + city.salary.toLocaleString('ru-RU') + ' ₽</div>' +
                '<div class="popup-count">На основе ' + city.count + ' записей</div>' +
            '</div>' +
            '<div class="popup-body">' +
                '<a href="https://getgrade.ru/devsalaries" target="_blank" class="popup-button">' +
                    '<svg class="popup-button-icon" viewBox="0 0 289 216" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                        '<path d="M19.785 93.1578C97.3411 62.77 148.981 42.581 174.915 32.7813C248.711 4.99524 264.219 0.208135 274.192 0C276.402 0 281.293 0.398925 284.6 2.79248C287.263 4.80445 287.942 7.38879 288.377 9.40076C288.812 11.3954 289.265 15.5928 288.812 18.7842C284.826 56.7688 267.543 148.938 258.684 191.311C254.907 209.314 247.597 215.316 240.514 215.905C224.988 217.102 213.258 206.713 198.394 197.919C174.915 184.13 161.844 175.527 139.008 161.929C112.64 146.336 129.697 137.751 144.769 123.754C148.755 120.146 216.791 64.175 218.131 59.1797C218.34 58.5727 218.34 56.1791 216.791 54.9823C215.242 53.7856 213.031 54.1845 211.256 54.5834C208.819 54.9823 171.59 77.3742 99.1164 121.551C88.482 128.142 78.9615 131.351 70.3113 131.142C60.7734 130.952 42.6027 126.355 28.8703 122.349C12.2486 117.544 -1.04868 114.96 0.0652293 106.548C0.726615 102.16 7.37528 97.7541 19.785 93.1578Z" fill="white"/>' +
                    '</svg>' +
                    'Смотреть все ЗП' +
                '</a>' +
                '<div class="popup-section">' +
                    '<div class="popup-section-title">Топ специализации</div>' +
                    '<div class="popup-tags">' + stacksHTML + '</div>' +
                '</div>' +
                '<div class="popup-section">' +
                    '<div class="popup-section-title">Топ работодатели</div>' +
                    '<div class="popup-companies">' + companiesHTML + '</div>' +
                '</div>' +
            '</div>'
        );
        
        var marker = new mapboxgl.Marker(container)
            .setLngLat([city.lng, city.lat])
            .setPopup(popup)
            .addTo(map);
        
        var labelEl = container.querySelector('.marker-label');
        
        popup.on('open', function() {
            if (labelEl) labelEl.classList.add('hidden');
        });
        
        popup.on('close', function() {
            if (labelEl) labelEl.classList.remove('hidden');
        });
    });
    
function updateLabelsVisibility() {
        var zoom = map.getZoom();
        
        cities.forEach(function(city) {
            var cityName = city.name;
            var markers = document.querySelectorAll('.marker-label');
            
            markers.forEach(function(label) {

                var labelCity = label.querySelector('.marker-label-city').textContent;
                var salaryLabel = label.querySelector('.marker-label-salary'); 
                
                if (labelCity !== cityName) {
                    return;
                }
                
                if (city.count < 4 && zoom < 5) {
                    label.style.display = 'none';
                    return;
                }
                
                if (zoom < 3.5) {
                    if (topTwoCities.indexOf(labelCity) !== -1) {
                        label.style.display = 'flex';
                    } else {
                        label.style.display = 'none';
                    }
                } else if (zoom >= 3.5 && zoom < 4.5) {
                    if (topFiveCities.indexOf(labelCity) !== -1) {
                        label.style.display = 'flex';
                    } else {
                        label.style.display = 'none';
                    }
                } else {
                    label.style.display = 'flex';
                }
                
                if (salaryLabel) {
                    if (zoom < 4) {
                        salaryLabel.style.display = 'none';
                    } else {
                        salaryLabel.style.display = 'block';
                    }
                }
            });
        });
    }
    
    updateLabelsVisibility();
    
    map.on('zoomend', updateLabelsVisibility);
    map.on('zoom', updateLabelsVisibility);
});
